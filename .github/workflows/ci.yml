name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/requirements.lock.txt
      - run: python -m pip install -r requirements/requirements.lock.txt
      - run: python -m pytest tests -q

  java:
    name: Java tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAVEN_OPTS: -Xmx512m -XX:ActiveProcessorCount=2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run service unit tests
        run: >-
          mvn -B -ntp -f backend/java/tingshu-parent/pom.xml
          -pl service/service-user,service/service-order -am
          -DskipTests=false
          -Dtest=AssistantOrderServiceTest,AssistantUserApiControllerTest,AccessServiceTest,LocalPaymentServiceTest
          -Dsurefire.failIfNoSpecifiedTests=false
          '-DargLine=-Xmx192m -XX:ActiveProcessorCount=2 -XX:TieredStopAtLevel=1'
          test

  frontend:
    name: H5 build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/uniapp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/uniapp/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build:h5
